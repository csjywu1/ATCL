[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actp-trajectory-prediction"
version = "2.0.0"
description = "Adaptive Contrastive Learning for Trajectory Prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1"]

[tool.setuptools.packages.find]
include = ["actp*", "data*", "model*", "train*", "inference*"]
